<style>

    min-height:100vh;

  .wrap{max-width:1180px;margin:0 auto;}

  header{

  .poem{

  .poem span.lead{

  .subtitle .divider{

  .card{

    height:460px;

  }
  .card-inner{
    position:relative;
    width:100%;height:100%;
    transition:transform 0.7s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
  }
  .card.flipped .card-inner{
    transform:rotateY(180deg);
    -webkit-transform:rotateY(180deg);
  }
  .face{
    position:absolute;inset:0;

    line-height:1;
    color:var(--kraft-darker);

const grid = document.getElementById('grid');
DATA.forEach((d) => {
  const card = document.createElement('div');
  card.className = 'card';

  const tagsHtml = d.kw.filter(k => k && k.trim()).map(k => `<span>#${escapeHtml(k)}</span>`).join('');
  const tagsLine = d.kw.filter(k => k && k.trim()).map(k => `#${escapeHtml(k)}`).join(' ');
  const nickHtml = d.nickname && d.nickname.trim() ? ` <span class="nick">(${escapeHtml(d.nickname)})</span>` : '';

  card.innerHTML = `
    <div class="card-inner">
      <div class="face front">
        <div class="seal">陶</div>
        <div class="tags">${tagsHtml}</div>
        <div class="hint">點擊拆信 →</div>
      </div>
      <div class="face back">
        <p class="who">${escapeHtml(d.name)}${nickHtml}</p>
        <p class="tags-line">${tagsLine}</p>
        <div class="msg-wrap">
          <div class="msg">${escapeHtml(d.msg)}</div>
          <div class="more-arrow">▾</div>
        </div>
      </div>
    </div>
  `;

  card.addEventListener('click', () => card.classList.toggle('flipped'));
  grid.appendChild(card);

  const msgEl = card.querySelector('.msg');
  const wrapEl = card.querySelector('.msg-wrap');
  const checkOverflow = () => {
    const hasMore = msgEl.scrollHeight > msgEl.clientHeight + 2;
    wrapEl.classList.toggle('has-more', hasMore);
    if(hasMore){
      const atBottom = msgEl.scrollTop + msgEl.clientHeight >= msgEl.scrollHeight - 2;
      wrapEl.classList.toggle('at-bottom', atBottom);
    } else {
      wrapEl.classList.remove('at-bottom');
    }
  };
  checkOverflow();
  msgEl.addEventListener('scroll', checkOverflow);
  window.addEventListener('resize', checkOverflow);
});

function escapeHtml(str){
  if(!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
